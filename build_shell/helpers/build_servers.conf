# Where the Android engine is built, see build_shell/helpers/build_server.sh: auto (the local Extender on
# localhost:9000 when it answers, else build.defold.com), local (the local Extender, an error when it
# does not answer), cloud (build.defold.com) or a url. iOS builds always use the cloud.
debug_build_server=auto
release_build_server=auto
